<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villa Harapan - Sewa Villa Nyaman di Kota Bunga</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-green-700 text-white py-4 shadow-lg">
    <div class="container mx-auto text-center">
      <h1 class="text-3xl font-bold">Villa Harapan</h1>
      <p class="text-sm">Tempat istirahat tenang di jantung Kota Bunga</p>
    </div>
  </header>

  <section class="text-center py-10">
    <h2 class="text-2xl font-semibold mb-6">Form Booking Villa</h2>
    <form id="bookingForm" class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-md space-y-4">
      <div>
        <label class="block mb-2 font-medium">Nama Lengkap</label>
        <input type="text" id="nama" class="w-full border p-2 rounded-md" placeholder="Masukkan nama anda" required />
      </div>
      <div>
        <label class="block mb-2 font-medium">Tanggal Check-in</label>
        <input type="date" id="checkin" class="w-full border p-2 rounded-md" required />
      </div>
      <div>
        <label class="block mb-2 font-medium">Tanggal Check-out</label>
        <input type="date" id="checkout" class="w-full border p-2 rounded-md" required />
      </div>
      <div>
        <label class="block mb-2 font-medium">Jumlah Tamu</label>
        <input type="number" id="tamu" class="w-full border p-2 rounded-md" min="1" placeholder="Contoh: 4 orang" required />
      </div>
      <div>
        <label class="block mb-2 font-medium">Pesan Tambahan</label>
        <textarea id="pesan" class="w-full border p-2 rounded-md" rows="3" placeholder="Tuliskan permintaan khusus (opsional)"></textarea>
      </div>
      <button type="submit" class="w-full bg-green-700 text-white py-2 rounded-lg hover:bg-green-800 transition">Kirim Booking via WhatsApp</button>
    </form>

    <p id="konfirmasiPesan" class="text-green-700 font-semibold mt-6 hidden">✅ Terima kasih! Booking kamu sedang kami proses. Kami akan menghubungi kamu segera via WhatsApp.</p>
  </section>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const checkin = document.getElementById('checkin').value;
      const checkout = document.getElementById('checkout').value;
      const tamu = document.getElementById('tamu').value;
      const pesan = document.getElementById('pesan').value;

      const text = `Halo, saya ingin melakukan booking di *Villa Harapan*:%0A%0A` +
        `Nama: ${nama}%0A` +
        `Check-in: ${checkin}%0A` +
        `Check-out: ${checkout}%0A` +
        `Jumlah Tamu: ${tamu}%0A` +
        (pesan ? `Pesan Tambahan: ${pesan}%0A` : '') +
        `%0ATerima kasih.`;

      const nomor = '6281234567890'; // Ganti dengan nomor WhatsApp kamu
      const url = `https://wa.me/${nomor}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');

      // Tampilkan pesan konfirmasi otomatis
      const konfirmasi = document.getElementById('konfirmasiPesan');
      konfirmasi.classList.remove('hidden');
      konfirmasi.scrollIntoView({ behavior: 'smooth' });
    });
  </script>

  <footer class="bg-green-700 text-white text-center py-4 mt-10">
    <p>&copy; 2025 Villa Harapan. Semua Hak Dilindungi.</p>
  </footer>
</body>
</html>
